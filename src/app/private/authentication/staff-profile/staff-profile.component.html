<div class="row m-0">
  <div>
    <!-- Section Start
              ======================== -->
    <form [formGroup]="userDetailsForm" (ngSubmit)="saveUserDetails()">
      <div class="mainForm" formGroupName="generalInformation">
        <h2>General Information </h2>
        <div class="row">
          <div class="col-sm-6">
            <!-- Start -->
            <div class="form-floating">
              <input class="form-control" id="FirstName" formControlName="firstName" name="firstName" required
                     type="text" placeholder="First Name">
              <label for="FirstName">First Name</label>
              <div *ngIf="firstName?.invalid && (firstName?.dirty || firstName?.touched)" class="input-error">
                <div *ngIf="firstName?.errors?.['errorMessage']">
                  <small>* First Name {{ firstName?.errors?.errorMessage }}</small>
                </div>
              </div>
            </div>
            <!-- End -->
          </div>
          <div class="col-sm-6">
            <!-- Start -->
            <div class="form-floating">
              <input class="form-control" id="LastName" formControlName="lastName" name="lastName" required type="text"
                     placeholder="LastName">
              <label for="LastName">Last Name</label>
              <div *ngIf="lastName?.invalid && (lastName?.dirty || lastName?.touched)" class="input-error">
                <div *ngIf="lastName?.errors?.['errorMessage']">
                  <small>* Last Name {{ lastName?.errors?.errorMessage }}</small>
                </div>
              </div>
            </div>
            <!-- End -->
          </div>
        </div>

        <!-- Form Footer Buttons Start -->
        <div class="row ">
          <div class="col-sm-12 pull-right">
            <button class="btn btn-success pull-right m-l-20" type="submit">Update Profile</button>
          </div>
        </div>
        <!-- Form Footer Buttons End -->
      </div>
    </form>
  </div>
</div>
