<h4 style="text-align: center">{{graphHeaderLabel}} <br /><br /></h4>

<div>
  <div style="display: block">
    <canvas
      baseChart
      [datasets]="barChartData"
      [labels]="mbarChartLabels"

      (chartClick)="chartClicked($event)"
    ></canvas>
  </div>
</div>
