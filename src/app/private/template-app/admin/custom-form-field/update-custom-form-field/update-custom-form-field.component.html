<section>
    <div class="alert alert-warning alert-dismissible fade show" role="alert" *ngIf="pageErrors.length > 0">
        <button style="float:right;" type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
        Fix the below errors :
        <br>
        <br>
        <ol>
            <ng-container *ngFor="let pageError of pageErrors">
                <li>
                    <strong>{{ pageError }}</strong>
                </li>
            </ng-container>
        </ol>
    </div>

    <div class="container1 dashboard-inner-pages">
        <form (ngSubmit)="updateCustomFormField()" id="update-custom-form-field-form">
            <div class="row" *ngIf="sectionsShowHideInfo.enableUpdateCustomFormFieldSection">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="card">
                        <div class="card-body">
                            <h2>Edit Custom Form Field</h2>
                            <app-child-section-form [childSectionRowFieldsCount]="2"  [pageComponentReference]="pageComponentReference" [childSectionFields]="updateCustomFormFieldSectionFields" [childSectionData]="updateCustomFormFieldSectionData" [childSectionSelectOptionsData]="updateCustomFormFieldSelectOptionsData"  [childSectionSearchResponseListObject]="updateCustomFormFieldSelectedLookupsDataListObj"></app-child-section-form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="card">
                        <div class="card-body m-auto">
                            <div class="m-auto">
                                <button style="float: left;" class="btn btn-success m-l-20">Save</button>
                                <button style="margin-left: 15px; float: left;" *ngIf="doesUserHaveAccess('RetrieveCustomFormField')" [routerLink]="['/in/retrieve-custom-form-field']" [queryParams]="{id: selectedCustomFormFieldUUID}"  class="btn btn-secondary m-l-20">Back To View Page</button>
                                <button style="margin-left: 15px; float: left;" *ngIf="doesUserHaveAccess('GetApiCustomFormFieldList')" [routerLink]="['/in/get-api-custom-form-field-list']" class="btn btn-secondary m-l-20">Back To List Page</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>



        <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-lg-flex align-items-center mb-2 gap-3" *ngIf="lineItemsSectionsShowHideInfo.enableRetrieveFormFieldApiListSection">
                            <div style="float: left;">
                                <h2>Form Field Api List</h2>
                            </div>
                            <div class="ms-auto"><a href="javascript:;"
                                                    class="btn btn-primary radius-30 mt-2 mt-lg-0" (click)="toggleCreateFormFieldApiPopup(createFormFieldApiPopup)">
                                Add</a>
                            </div>
                        </div>

                        <div class="table-responsive mt-3"  *ngIf="lineItemsSectionsShowHideInfo.enableRetrieveFormFieldApiListSection">
                            <table class="table mb-0">
                                <thead class="table-light">
                                <tr>
                                    <ng-container *ngFor="let retrieveFormFieldApiListTableColumn of retrieveFormFieldApiListTableColumns">
                                        <th class="{{ retrieveFormFieldApiListTableColumn.displayClassName }}">{{ retrieveFormFieldApiListTableColumn.label }}</th>
                                    </ng-container>
                                    
                                    <th *ngIf="doesUserHaveAccess('UpdateFormFieldApi')">Edit</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr *ngFor="let resultObject of retrieveFormFieldApiListResultObjectsList">
                                    <ng-container *ngFor="let retrieveFormFieldApiListTableColumn of retrieveFormFieldApiListTableColumns">
                                        <td class="{{ retrieveFormFieldApiListTableColumn.displayClassName }}">
                                            <app-dynamic-field-display [pageField]="retrieveFormFieldApiListTableColumn" [dataObject]="resultObject"></app-dynamic-field-display>
                                        </td>
                                    </ng-container>
                                    
                                    <td *ngIf="doesUserHaveAccess('UpdateFormFieldApi')">
                                        <a (click)="toggleUpdateFormFieldApiPopup(updateFormFieldApiPopup, resultObject.formFieldApiUUID)"
                                           class="btn btn-primary btn-sm btnView ">Edit</a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>
</section>
<!--BEGIN SEARCH POPUPS-->

<!--END SEARCH POPUPS-->

<!-- ************** Popup - start ********** -->
<!-- Button trigger modal -->
<ng-template #createFormFieldApiPopup let-modal>
<div class="dashboard-inner-pages dashboard-inner-pages-modal">
    <div class="modal-header">
        <h2 id="create-form-field-api-modal-title">New Form Field Api</h2>
        <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body" id="create-form-field-api-modal-body">
        <section>
            <div class="container1">
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <div class="card">
                            <div class="card-body">
                                <app-child-section-form [childSectionRowFieldsCount]="1"  [pageComponentReference]="pageComponentReference" [childSectionFields]="createFormFieldApiSectionFields" [childSectionData]="createFormFieldApiSectionData" [childSectionSelectOptionsData]="createFormFieldApiSelectOptionsData"  [childSectionSearchResponseListObject]="createFormFieldApiSelectedLookupsDataListObj"></app-child-section-form>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="align-items-center mb-2 gap-3">
                    <div class="m-auto mt-3"  style="float:right;">
                        <a href="javascript:;"
                           class="btn radius-30 mt-2 mt-lg-0" (click)="modal.dismiss()">Cancel</a>
                        <a style="float:right;" href="javascript:;"
                           class="btn btn-success pull-right m-l-20" (click)="handleCreateFormFieldApi(modal)">Save</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
</ng-template>

<!-- ************** popup  - end ************ -->
<!-- ************** Popup - start ********** -->
<!-- Button trigger modal -->
<ng-template #updateFormFieldApiPopup let-modal>
<div class="dashboard-inner-pages dashboard-inner-pages-modal">
    <div class="modal-header">
        <h2 id="update-form-field-api-modal-title">Edit Form Field Api</h2>
        <button type="button" class="btn-close"  (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body" id="update-form-field-api-modal-body">
        <section>
            <div class="container1">
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <div class="card">
                            <div class="card-body">
                                <app-child-section-form [childSectionRowFieldsCount]="1"  [pageComponentReference]="pageComponentReference" [childSectionFields]="updateFormFieldApiSectionFields" [childSectionData]="updateFormFieldApiSectionData" [childSectionSelectOptionsData]="updateFormFieldApiSelectOptionsData"  [childSectionSearchResponseListObject]="updateFormFieldApiSelectedLookupsDataListObj"></app-child-section-form>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="align-items-center mb-2 gap-3">
                    <div class="m-auto mt-3" style="float:right;">
                        <a href="javascript:;"
                           class="btn radius-30 mt-2 mt-lg-0" (click)="modal.dismiss()">Cancel</a>
                        <a style="float:right;" href="javascript:;"
                           class="btn btn-success pull-right m-l-20" (click)="handleUpdateFormFieldApi(modal)">Save</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
</ng-template>

<!-- ************** popup  - end ************ -->
