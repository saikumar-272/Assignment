<section>
  <div class="container1 dashboard-inner-pages">
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="card-body">
            <!--User Actions - Start-->
            <div
              ngbDropdown
              class="d-inline-block"
              style="float: right"
              *ngIf="showUserActions()"
            >
              <button
                type="button"
                class="btn btn-outline-primary"
                ngbDropdownToggle
              >
                Actions
              </button>
              <div ngbDropdownMenu>
                <ng-container *ngFor="let userAction of userActions">
                  <button
                    ngbDropdownItem
                    (click)="executeUserAction(userAction.actionName)"
                  >
                    {{ userAction.actionLabel }}
                  </button>
                </ng-container>
              </div>
            </div>
            <!--User Actions - End-->
          </div>
        </div>
      </div>

      <!--BEGIN SECTIONS-->
      <div
        class="col-lg-12 col-md-12 col-sm-12 col-xs-12"
        *ngIf="sectionsShowHideInfo.enableRetrieveSalesInvoiceSection"
      >
        <div class="card">
          <div class="card-body">
            <h2>Sales Invoice</h2>
            <ng-container
              *ngFor="let pageField of retrieveSalesInvoiceFieldList"
            >
              <div class="row {{ pageField.displayClassName }}">
                <div class="col-lg-3 col-md-3 col-sm-3 col-xs-12">
                  <div class="invoicelist-inner">
                    <label class="form-label"
                      ><b>{{ pageField.label }}</b></label
                    >
                  </div>
                </div>
                <div class="col-lg-9 col-md-9 col-sm-9 col-xs-12">
                  <div class="invoicelist-inner">
                    <app-dynamic-field-display
                      [pageField]="pageField"
                      [dataObject]="retrievedDataObject"
                    ></app-dynamic-field-display>
                  </div>
                </div>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
      <!--END SECTIONS-->
      <!--BEGIN LINE_ITEMS-->
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="card-body">
            <div
              *ngIf="
                lineItemsSectionsShowHideInfo.enableRetrieveInvoiceLineItemListSection
              "
            >
              <div class="d-lg-flex align-items-center mb-2 gap-3">
                <div style="float: left">
                  <h2>Invoice Line Item List</h2>
                </div>
              </div>
            </div>
            <div
              class="table-responsive mt-3"
              *ngIf="
                lineItemsSectionsShowHideInfo.enableRetrieveInvoiceLineItemListSection
              "
            >
              <table class="table mb-0">
                <thead class="table-light">
                  <tr>
                    <ng-container
                      *ngFor="
                        let retrieveInvoiceLineItemListTableColumn of retrieveInvoiceLineItemListTableColumns
                      "
                    >
                      <th
                        class="{{
                          retrieveInvoiceLineItemListTableColumn.displayClassName
                        }}"
                      >
                        {{ retrieveInvoiceLineItemListTableColumn.label }}
                      </th>
                    </ng-container>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    *ngFor="
                      let resultObject of retrieveInvoiceLineItemListResultObjectsList
                    "
                  >
                    <ng-container
                      *ngFor="
                        let retrieveInvoiceLineItemListTableColumn of retrieveInvoiceLineItemListTableColumns
                      "
                    >
                      <td
                        class="{{
                          retrieveInvoiceLineItemListTableColumn.displayClassName
                        }}"
                      >
                        <app-dynamic-field-display
                          [pageField]="retrieveInvoiceLineItemListTableColumn"
                          [dataObject]="resultObject"
                        ></app-dynamic-field-display>
                      </td>
                    </ng-container>
                  </tr>
                </tbody>
              </table>
            </div>
            <div
              *ngIf="
                lineItemsSectionsShowHideInfo.enableRetrieveCostCenterLineItemListSection
              "
            >
              <div class="d-lg-flex align-items-center mb-2 gap-3">
                <div style="float: left">
                  <h2>Retrieve Cost Center Line Item List</h2>
                </div>
              </div>
            </div>
            <div
              class="table-responsive mt-3"
              *ngIf="
                lineItemsSectionsShowHideInfo.enableRetrieveCostCenterLineItemListSection
              "
            >
              <table class="table mb-0">
                <thead class="table-light">
                  <tr>
                    <ng-container
                      *ngFor="
                        let retrieveCostCenterLineItemListTableColumn of retrieveCostCenterLineItemListTableColumns
                      "
                    >
                      <th
                        class="{{
                          retrieveCostCenterLineItemListTableColumn.displayClassName
                        }}"
                      >
                        {{ retrieveCostCenterLineItemListTableColumn.label }}
                      </th>
                    </ng-container>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    *ngFor="
                      let resultObject of retrieveCostCenterLineItemListResultObjectsList
                    "
                  >
                    <ng-container
                      *ngFor="
                        let retrieveCostCenterLineItemListTableColumn of retrieveCostCenterLineItemListTableColumns
                      "
                    >
                      <td
                        class="{{
                          retrieveCostCenterLineItemListTableColumn.displayClassName
                        }}"
                      >
                        <app-dynamic-field-display
                          [pageField]="
                            retrieveCostCenterLineItemListTableColumn
                          "
                          [dataObject]="resultObject"
                        ></app-dynamic-field-display>
                      </td>
                    </ng-container>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <!--END LINE_ITEMS-->
      <!-- Start page total attributes-->
      <div class="row m-0" style="padding-top: 20px; padding-left: 30px">
        <div class="col-md-12 m-0 p-0">
          <p class="control-label pull-right">
            <span style="font-weight: bold">Net Amount : </span>{{ netAmount }}
          </p>
        </div>
      </div>
      <!-- End page total attributes-->
    </div>
    <div style="display: flex; justify-content: space-between; gap: 8px">
      <button
        style="margin-right: 0px; padding-bottom: 0px"
        *ngIf="doesUserHaveAccess('UpdateSalesInvoice')"
        [routerLink]="['/in/update-sales-invoice']"
        [queryParams]="{ id: selectedSalesInvoiceUUID }"
        class="btn btn-success pull-right m-l-20"
      >
        <i class="bi bi-pencil-square"></i> Edit
      </button>
      <button
        style="margin-left: 0px"
        *ngIf="doesUserHaveAccess('RetrieveSalesInvoiceList')"
        [routerLink]="['/in/sales-invoice-list']"
        class="btn btn-secondary m-l-20 back-btn"
      >
        Back To List Page
      </button>
    </div>
  </div>
</section>
