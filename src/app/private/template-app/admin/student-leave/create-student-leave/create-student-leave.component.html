<section>
    <div class="alert alert-warning alert-dismissible fade show" role="alert" *ngIf="pageErrors.length > 0">
        <button style="float:right;" type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
        Fix the below errors :
        <br>
        <br>
        <ol>
            <ng-container *ngFor="let pageError of pageErrors">
                <li>
                    <strong>{{ pageError }}</strong>
                </li>
            </ng-container>
        </ol>
    </div>

    <div class="container1 dashboard-inner-pages">

        <form (ngSubmit)="createStudentLeave()" id="create-student-leave-form">
            <div class="row" *ngIf="sectionsShowHideInfo.enableCreateStudentLeaveSection">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="card">
                        <div class="card-body">
                                <h2>New StudentLeave</h2>
                                <app-child-section-form [childSectionRowFieldsCount]="2" [pageComponentReference]="pageComponentReference" [childSectionFields]="createStudentLeaveSectionFields" [childSectionData]="createStudentLeaveSectionData" [childSectionSelectOptionsData]="createStudentLeaveSelectOptionsData" ></app-child-section-form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="card">
                        <div class="card-body">
                            <button class="btn btn-success pull-right m-l-20">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>



    </div>
</section>
