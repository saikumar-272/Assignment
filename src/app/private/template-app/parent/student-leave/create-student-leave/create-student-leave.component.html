<div class="alert alert-warning alert-dismissible fade show" role="alert" *ngIf="pageErrors.length > 0">
    <button style="float:right;" type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
    </button>
    Fix the below errors :
    <br>
    <br>
    <ol>
        <ng-container *ngFor="let pageError of pageErrors">
            <li>
                <strong>{{ pageError }}</strong>
            </li>
        </ng-container>
    </ol>
</div>

<div class="container">
    <div class="row">
        <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12">
            <div class="page-wrapper">
                <div class="page-content">
                    <!--breadcrumb-->
                    <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
                        <div class="breadcrumb-title pe-3">Home</div>
                        <div class="ps-3">
                            <nav aria-label="breadcrumb">
                                <ol class="breadcrumb mb-0 p-0">
                                    <li class="breadcrumb-item"><a href="javascript:;"><i
                                            class="bx bx-home-alt"></i></a> <i
                                            class="bi bi-chevron-right"></i>
                                    </li>
                                    <li class="breadcrumb-item active" aria-current="page">{{ pageHeading }}
                                    </li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                    <!--end breadcrumb-->
                    <section>
                        <div class="container1">
                            <div class="row" id="create-student-leave-form">
                                <!-- --------------- Begin New StudentLeave Section ----------------- -->
                                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" *ngIf="sectionsShowHideInfo.enableCreateStudentLeaveSection">
                                    <div class="card">
                                        <div class="card-body">
                                            <div class="page-title-btn-group">
                                                <div class="row align-items-center">
                                                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                                                        <div>
                                                            <h3>New StudentLeave</h3>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <app-parent-child-section-form [childSectionRowFieldsCount]="2" [pageComponentReference]="pageComponentReference" [childSectionFields]="createStudentLeaveSectionFields" [childSectionData]="createStudentLeaveSectionData" [childSectionSelectOptionsData]="createStudentLeaveSelectOptionsData" ></app-parent-child-section-form>
                                        </div>
                                    </div>
                                </div>
                                <!-- --------------- End New StudentLeave Section ----------------- -->
                                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                                    <div class="create-sales-invoice-save-btn">
                                        <a href="javascript:;" (click)="createStudentLeave()"
                                           class="btn btn-primary radius-30 mt-2 mt-lg-0 search"> Save </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</div>
