<div class="container">
    <div class="row">
        <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12">
            <div class="page-wrapper">
                <div class="page-content">

                    <!--breadcrumb-->
                    <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
                        <div class="breadcrumb-title pe-3">Home</div>
                        <div class="ps-3">
                            <nav aria-label="breadcrumb">
                                <ol class="breadcrumb mb-0 p-0">
                                    <li class="breadcrumb-item"><a href="javascript:;"><i
                                            class="bx bx-home-alt"></i></a> <i
                                            class="bi bi-chevron-right"></i>
                                    </li>
                                    <li class="breadcrumb-item active" aria-current="page">Search StudentLeave</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                    <!--end breadcrumb-->
                    <section>
                        <div class="container1">
                            <div class="row">
                                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                                    <div class="card">
                                        <div class="card-body">
                                            <!-- ********** Invoice No ******** -->
                                            <div class="page-title-btn-group">
                                                <div class="row align-items-center">
                                                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                                                        <div>
                                                            <h3>Search StudentLeave</h3>
                                                        </div>
                                                    </div>
                                                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                                                        <div>
                                                            <div
                                                                    class="d-lg-flex align-items-center mb-2 gap-3 btn-group-inner">
                                                                <div class="ms-auto">
                                                                    <a href="javascript:;" (click)="search()"
                                                                       class="btn btn-primary radius-30 mt-2 mt-lg-0 search">
                                                                        <i class="bi bi-search"></i> Search </a>
                                                                    <a href="javascript:;" (click)="resetSearchCriteria()"
                                                                       class="btn btn-primary radius-30 mt-2 mt-lg-0 reset">
                                                                        <i class="bi bi-arrow-clockwise"></i>
                                                                        Reset</a>
                                                                    <a [routerLink]="['/parent/create-student-leave']" *ngIf="doesUserHaveAccess('CreateStudentLeave')"
                                                                       class="btn btn-primary radius-30 mt-2 mt-lg-0 addnew">
                                                                        <i class="bi bi-plus-lg"></i> Add
                                                                        New</a>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row">
                                                <app-parent-child-section-form [childSectionRowFieldsCount]="2"  [pageComponentReference]="pageComponentReference" [childSectionFields]="retrieveStudentLeaveListSectionFields" [childSectionData]="retrieveStudentLeaveListSectionData" [childSectionSelectOptionsData]="retrieveStudentLeaveListSelectOptionsData" ></app-parent-child-section-form>
                                            </div>
                                            <!-- ********** Invoice No form ******** -->
                                            <!-- ************* table ************ -->
                                            <div class="table-search-results">
                                                <div class="page-title-btn-group">
                                                    <div class="row align-items-center">
                                                        <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                                                            <div>
                                                                <h3>Search Results</h3>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="table-responsive">
                                                    <table
                                                            class="table table-striped mb-0 alternate-row-colors">
                                                        <thead class="table-light">
                                                            <tr>
                                                                
                                                                <ng-container *ngFor="let retrieveStudentLeaveListTableColumn of retrieveStudentLeaveListTableColumns">
                                                                    <th class="text-center {{ retrieveStudentLeaveListTableColumn.displayClassName }}">{{ retrieveStudentLeaveListTableColumn.label }}</th>
                                                                </ng-container>
                                                                <ng-container *ngFor="let userAction of userActions">
                                                                    <th class="text-center">{{userAction.actionLabel}}</th>
                                                                </ng-container>
                                                                <th class="text-center" *ngIf="doesUserHaveAccess('RetrieveStudentLeave')">
                                                                    View
                                                                </th>
                                                                
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                        <tr *ngFor="let searchResultObject of searchResultObjectsList">
                                                            
                                                            <ng-container *ngFor="let retrieveStudentLeaveListTableColumn of retrieveStudentLeaveListTableColumns">
                                                                <td class="text-center {{ retrieveStudentLeaveListTableColumn.displayClassName }}" [innerHTML]="getPropertyValue(searchResultObject, retrieveStudentLeaveListTableColumn, 'Search', 'retrieveStudentLeaveList')">
                                                                </td>
                                                            </ng-container>
                                                            <ng-container *ngFor="let userAction of userActions">
                                                                <td class="text-center">
                                                                    <a (click)="executeUserAction(userAction.actionName, searchResultObject)"
                                                                       class="btn btn-primary btn-sm btnView ">{{userAction.actionLabel}}</a>
                                                                </td>
                                                            </ng-container>
                                                            <td  class="text-center" *ngIf="doesUserHaveAccess('RetrieveStudentLeave')">
                                                                <div class="d-flex order-actions">
                                                                    <a [routerLink]="['/parent/retrieve-student-leave']" [queryParams]="{id: searchResultObject.studentLeaveUUID}" class="ms-3"
                                                                       data-bs-toggle="tooltip"
                                                                       title="View"><i
                                                                            class="bi bi-eye-fill"></i></a>
                                                                </div>
                                                            </td>
                                                            
                                                        </tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                                <div class="table-Page-navigation">
                                                    <nav aria-label="Page navigation example">
                                                        <ngb-pagination class="col" [(page)]="currentPage" [pageSize]="pageSize"
                                                                        (pageChange)="handleStudentLeaveListPageChange()" [collectionSize]="collectionSize" [maxSize]="5"
                                                                        [boundaryLinks]="true">
                                                            <ng-template ngbPaginationPrevious>Prev</ng-template>
                                                            <ng-template ngbPaginationNext>Next</ng-template>
                                                            <ng-template ngbPaginationFirst>First</ng-template>
                                                            <ng-template ngbPaginationLast>Last</ng-template>
                                                            <ng-template ngbPaginationNumber let-page>{{ page }}
                                                            </ng-template>
                                                        </ngb-pagination>
                                                    </nav>
                                                </div>
                                            </div>

                                            <!-- ************* table ************ -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</div>
