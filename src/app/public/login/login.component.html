<section>
  <!-- Login 36 start -->
  <div class="login">
    <div class="container-fluid">
      <div class="row">
        <div
          class="col-lg-7 login-bg-img"
          style="
            background-image: url('https://assets.htsbusiness.com/hygieneer/hygieneer.jpg');
          "
        >
          <div class="info clearfix">
            <div class="name_wrap" style="text-align: center">
              <h1><span>Welcome</span></h1>
              <h1>HTS ERP and CRM Solutions</h1>
            </div>
          </div>
        </div>
        <div class="col-lg-5 form-section">
          <div class="form-inner">
            <a [routerLink]="['/']" class="logo">
              <img
                src="https://assets.htsbusiness.com/hygieneer/hygieneer.jpg"
                alt="logo"
              />
            </a>
            <h3>Sign Into Your Account</h3>
            <div *ngIf="requestFailureMsg" class="modal-title border-bottom-0">
              <p>
                <ngb-alert [dismissible]="false" type="danger">
                  {{ requestFailureMsg }}
                </ngb-alert>
              </p>
            </div>
            <form [formGroup]="loginForm" (ngSubmit)="login()">
              <app-child-section-form
                [childSectionRowFieldsCount]="1"
                [pageComponentReference]="pageComponentReference"
                [childSectionFields]="loginSectionFields"
                [childSectionData]="loginSectionData"
                [childSectionSelectOptionsData]="loginSelectOptionsData"
              ></app-child-section-form>
              <div class="checkbox form-group form-box">
                <div class="form-check checkbox-theme">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    value=""
                    id="rememberMe"
                  />
                  <label class="form-check-label" for="rememberMe">
                    Remember me
                  </label>
                </div>
                <a
                  [routerLink]="['/public/forgot-password']"
                  class="forgot-password"
                  >Forgot Password</a
                >
              </div>
              <div class="form-group" *ngIf="enableNext">
                <button
                  type="button"
                  (click)="validateLoginDetails()"
                  class="btn-md btn-dark w-100"
                >
                  Next
                </button>
              </div>
              <div *ngIf="enableLogin" class="form-group">
                <button type="submit" class="btn-md btn-theme w-100">
                  Login
                </button>
              </div>
              <div *ngIf="enableReset" class="form-group">
                <button
                  type="button"
                  (click)="resetLoginDetails()"
                  class="btn-md btn-success w-100"
                >
                  Reset
                </button>
              </div>
              <div class="clearfix"></div>
              <!-- <ul class="social-list clearfix">
                                <li><a href="#" class="facebook-bg">Facebook</a></li>
                                <li><a href="#" class="twitter-bg">Twitter</a></li>
                                <li><a href="#" class="google-bg">Google</a></li>
                            </ul> -->
            </form>
            <div class="clearfix"></div>
            <p>
              Don't have an account?
              <a
                [routerLink]="['/public/create-customer-account']"
                class="thembo"
              >
                Register here</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Login 36 end -->
</section>
